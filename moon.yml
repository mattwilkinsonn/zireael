# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
#
# Root meta project (source '.'). Owns the repo-wide checks not tied to one
# tool: markdown lint, workflow lint, and the root-level nix files (devenv.nix)
# that the nix-config project doesn't cover. Plus the dev/release scripts that
# replaced the retired Justfile (release, install-debug — runInCI:false, never
# part of the gate). System tasks exec the devenv PATH toolchain.
layer: 'library'
language: 'bash'

tasks:
  markdownlint:
    command: 'markdownlint-cli2 "**/*.md"'
    inputs: ['**/*.md', '/.markdownlint-cli2.jsonc']
  actionlint:
    command: 'actionlint'
    inputs: ['/.github/workflows/*.yml', '/.github/workflows/*.yaml']
  # biome over the agent-extension TypeScript (push-guard, notify) under
  # nix-config/agents/extensions/. That tree is not a bun tool project (no
  # per-dir moon.yml), so nothing else lints it — root owns it, resolving the
  # repo-root biome.json. Keeps the extensions format-clean the way the tools/
  # projects self-lint theirs.
  agents-biome:
    command: 'bunx biome check nix-config/agents/extensions'
    inputs: ['/nix-config/agents/extensions/*.ts', '/biome.json']
  # Root-level *.nix (devenv.nix). maxdepth 1 so it doesn't recurse into
  # nix-config/ (its own project gates those) or .devenv/ (the nix store).
  nixfmt:
    script: "find . -maxdepth 1 -name '*.nix' -print0 | xargs -0 nixfmt --check"
    inputs: ['/*.nix']
  deadnix:
    script: "find . -maxdepth 1 -name '*.nix' -print0 | xargs -0 deadnix --fail"
    inputs: ['/*.nix']
  ci:
    deps: ['markdownlint', 'actionlint', 'agents-biome', 'nixfmt', 'deadnix']
    options:
      cache: false

  # ── Dev + release entrypoints (replaced the Justfile). Never gated. ──
  # `moon run root:release -- v0.3.0` cuts a release; install-debug builds
  # the tools to ~/.cargo/bin. Args pass through after `--`. Thin wrappers over
  # the bun/TypeScript tools under tools/ (converted from bash, SEA-932).
  release:
    command: 'bun run tools/release/index.ts'
    options:
      runInCI: false
      cache: false
  install-debug:
    command: 'bun run tools/install-debug/index.ts'
    options:
      runInCI: false
      cache: false
