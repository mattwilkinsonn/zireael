#:schema https://raw.githubusercontent.com/sealedsec/seal/main/schemas/seal.toml.json
schema_version = 1
name = "nix-config"

[model]
provider = "openrouter"
name = "deepseek/deepseek-v4-pro"
max_tokens = 32000

[capabilities.allow]
additional_directories = [
  "~/other-repos",
  "~",
  "/tmp",
  "/Users",
  "/Applications",
]

[capabilities.allow.read]
default_files = [
  "*.nix",
  "*.md",
  "*.lock",
  ".gitignore",
  "*.ps1",
  "*.yaml",
  "*.sh",
  "*.toml",
  "Containerfile",
  "Brewfile",
  "config",
  ".gitattributes",
  "*.pkl",
  "*.jsonc",
  "*.conf",
  ".wslconfig",
  "*",
]
paths = [
  "**",
  { path = "/tmp/**", files = [
    "*",
  ] },
  "~/other-repos/**",
  "~/**",
  "/Applications/**",
  "/Users/**",
]

[capabilities.allow.write]
default_files = [
  "*.nix",
  "*.md",
  "*.lock",
  ".gitignore",
  "*.ps1",
  "*.yaml",
  "*.sh",
  "*.toml",
  ".wslconfig",
  "Containerfile",
  "Brewfile",
  "config",
  ".gitattributes",
  "*.pkl",
  "yabairc",
  "skhdrc",
  "*.yml",
  "*.rs",
  "*.jsonc",
  "*.conf",
  ".wslconfig",
  "*.ts",
  ".bashrc",
  "config",
  "git_target",
  "*.bin",
  "*.txt",
  ".gitattributes",
]
paths = [
  "**",
  { path = "/tmp/**", files = [
    "*",
  ] },
  "~/.config/**",
  "~/.config/jj/**",
  "~/.github/workflows/**",
  "~/**",

]

[capabilities.allow.commands]
default_env_vars = [
  "HOME",
  "PATH",
  "JJ_HOOKS_RUNNER",
  "RUST_LOG",
  "RUSTC_WRAPPER",
]
patterns = [
  { command = "command:*", prompt = true },
  "nix:*",
  { command = "chmod:*", prompt = true },
  "ls:*",
  { command = "git:*", prompt = true },
  "pwd",
  { command = "rm:*", prompt = true },
  "mkdir:*",
  "cat:*",
  "find:*",
  "hostname",
  "nix-instantiate:*",
  "which shellcheck",
  "readlink:*",
  "echo:*",
  { command = "op:*", prompt = true },
  "jj st",
  "file:*",
  "cd:*",
  { command = "time git:*", prompt = true },
  "grep:*",
  { command = "sed:*", prompt = true },
  { command = "env:*", prompt = true },
  "which jj",
  { command = "for i in 1 2 3 4 5; do dd if=/dev/zero of=/tmp/jj-probe-2/home/.cache/junk/big$i.dat bs=1M count=2 2>/dev/null; done && ls -la /tmp/jj-probe-2/home/.cache/junk/", prompt = true },
  { command = "for i in 1 2 3; do dd if=/dev/zero of=/tmp/jj-probe-2/home/.cargo/registry/cache/blob$i.dat bs=1M count=3 2>/dev/null; done && ls /tmp/jj-probe-2/home/.cargo/registry/cache/", prompt = true },
  { command = "dd:*", prompt = true },
  { command = "mv:*", prompt = true },
  "shellcheck:*",
  "hostname:*",
  { command = "alias config:*", prompt = true },
  "jj diff:*",
  "head:*",
  { command = "/opt/homebrew/bin/brew shellenv:*", prompt = true },
  "which:*",
  "hk init:*",
  "hk builtins:*",
  { command = "nix-store:*", prompt = true },
  "hk init",
  { command = "hk config:*", prompt = true },
  { command = "&& mkdir:*", prompt = true },
  "hk validate:*",
  "nix shell:*",
  "jj-hp:*",
  { command = "export:*", prompt = true },
  "strings:*",
  "pkl:*",
  "ob:*",
  "tail:*",
  { command = "systemctl:*", prompt = true },
  { command = "journalctl:*", prompt = true },
  { command = "ps:*", prompt = true },
  { command = "pwd; ls:*", prompt = true },
  { command = "hostname; nixos-version:*", prompt = true },
  "jj log:*",
  { command = "pwd:*", prompt = true },
  "cp:*",
  "wc:*",
  "shfmt:*",
  { command = 'for c in lwmskrpw ylzzsnzv oxlznkks nqypkvru ryptzzzv vxkqzwpz rntkmvsk; do echo "=== $c ==="; jj diff -r $c --summary; done', prompt = true },
  "jj describe:*",
  "hk check:*",
  { command = "gh issue:*", prompt = true },
  "markdownlint-cli2:*",
  "taplo fmt:*",
  "nixfmt:*",
  { command = "jj:*", prompt = true },
  "jj edit:*",
  "jj restore:*",
  { command = "pwd:*", prompt = true },
  { command = "cp:*", prompt = true },
  { command = "wc:*", prompt = true },
  "shfmt:*",
  "linear issue create:*",
  "taplo --help:*",
  "jj new:*",
  { command = "gh run:*", prompt = true },
  { command = 'for f in flake.nix nixos/mattfw/openclaw.nix nixos/mattfw/home.nix shared/unstable-wholesale.nix; do nix-instantiate --parse "$f" > /dev/null && echo "$f OK" || echo "$f FAILED"; done', prompt = true },
  { command = "curl:*", domains = [
    "api.github.com",
    "*.github.com",
    "crates.io",
    "*.crates.io",
    "registry.npmjs.org",
    "api.linear.app",
    "www.npmjs.com",
    "graphite.com",
    "*.nixos.org",
    "nixos.org",
    "raw.githubusercontent.com",
    "graphite-58cc94ce.mintlify.dev",
  ], prompt = true },
  "git diff:*",
  "jj st:*",
  "jj status",
  "jj --help:*",
  "jj --version",
  "git status:*",
  "stat:*",
  "ping:*",
  "yabai:*",
  "jq:*",
  "sort:*",
  "defaults read:*",
  { command = "log show:*", prompt = true },
  "launchctl list:*",
  { command = "launchctl print:*", prompt = true },
  "id:*",
  "launchctl:*",
  "linear team get:*",
  "linear team list",
  "linear project list:*",
  "cargo check:*",
  "cargo nextest:*",
  "cargo run -p seal-policy --bin generate-schema:*",
  "bun scripts/gen-schema-reference.ts:*",
  "cargo fmt:*",
  "cargo clippy:*",
  "/usr/bin/sandbox-exec:*",
  { command = "linear:*", domains = [
    "api.linear.app",
    "*.linear.app",
  ], prompt = true },
  "man:*",
  { command = "bash:*", prompt = true },
  "sccache:*",
  "pgrep:*",
  "ps aux",
  "codesign:*",
  "xattr:*",
  "nc:*",
  { command = "python3:*", prompt = true },
]

[capabilities.deny.read]
default_files = ["*.key", "*.pem", ".env", ".env.*"]

[limits]
max_list_results = 1000


[command_run]
command_timeout = 120
command_max_timeout = 600
envrc_mode = "prompt"

[sandbox.os]
command_fs = "system"
command_tools = [
  "gh",
  "jj",
  "gt",
  "linear",
  "direnv",
  { tool = "cargo", sccache = true },
]
wrappers = ["just", "jj-hp"]

[sandbox.os.network]
dev_server_ports = [4226]

[security]
allow_runtime_expansion = true
allow_redirects = "streams"
allow_background = true
allow_pipes = true
allow_compound = true
allow_expansion = true
allow_case_terminator = true
allow_subshell = false
allow_privilege_wrappers = true
allow_python_interpreter = true
