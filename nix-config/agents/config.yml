modelRoles: 
  default: litellm/claude-opus:xhigh
theme: 
  dark: dark-rose-pine
  light: light-tokyo-night
symbolPreset: nerd
statusLine: 
  preset: default
  segmentOptions: 
    git: 
      showBranch: false
hideThinkingBlock: true
defaultThinkingLevel: xhigh
steeringMode: one-at-a-time
extensions: 
  - ~/.omp/agent/extensions/push-guard.ts
  - ~/.omp/agent/extensions/notify.ts
  # cotal-mesh: built from the Cotal fork by installCotalOmpExtension (shared/dev.nix).
  # A COTAL_NAME (+ optional COTAL_LINK/COTAL_AGENT_FILE) in the session env activates it;
  # no identity → inert, so a plain omp never joins the mesh.
  - ~/.local/src/cotal/extensions/connector-oh-my-pi/dist/extension.bundle.js
plan: 
  enabled: true
browser: 
  enabled: false
startup: 
  setupWizard: true
setupVersion: 1
dev: 
  autoqa: 
    consent: granted