modelRoles:
  default: litellm/claude-opus:xhigh
  plan: litellm/claude-fable:xhigh
  designer: litellm/claude-fable:xhigh
  advisor: litellm/claude-fable:xhigh
theme: 
  dark: dark-rose-pine
  light: light-tokyo-night
symbolPreset: nerd
statusLine: 
  preset: default
  segmentOptions: 
    git: 
      showBranch: false
hideThinkingBlock: true
defaultThinkingLevel: xhigh
steeringMode: one-at-a-time
compaction:
  # Usage management: agents rarely need the full ~1M window, and every request
  # riding a near-full context is what burns the token budget. Lower the active
  # threshold well below the ~85%/1M default so sessions compact earlier, and
  # turn on idle compaction so agents waiting on a gate/review shed context
  # while they wait. Strategy stays the default snapcompact (local, no LLM
  # summary call), so earlier/more-frequent compaction costs only prompt-cache
  # re-establishment, not summarization tokens.
  # Active: compact when live context exceeds this many tokens (overrides the
  # percentage default; clamped to the model window). 350k is a large working
  # budget for a single task yet ~2.4x lower than the old ~850k ceiling.
  thresholdTokens: 350000
  # Idle: waiting agents aren't cache-sensitive, so compact them aggressively.
  idleEnabled: true
  idleThresholdTokens: 120000
  idleTimeoutSeconds: 150
extensions: 
  - ~/.omp/agent/extensions/push-guard.ts
  - ~/.omp/agent/extensions/notify.ts
  # cotal-mesh: built from the Cotal fork by installCotalOmpExtension (shared/dev.nix).
  # A COTAL_NAME (+ optional COTAL_LINK/COTAL_AGENT_FILE) in the session env activates it;
  # no identity → inert, so a plain omp never joins the mesh.
  - ~/.local/src/cotal/extensions/connector-oh-my-pi/dist/extension.bundle.js
plan: 
  enabled: true
browser: 
  enabled: false
startup: 
  setupWizard: true
setupVersion: 1
dev: 
  autoqa: 
    consent: granted