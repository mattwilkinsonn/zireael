# OMP model configuration — symlinked to ~/.omp/agent/models.yml by
# shared/agent-config.nix. Authored here so it is declarative and version
# controlled; config.yml and agent.db stay OMP-managed live state.
#
# The built-in `litellm` provider auto-discovers the mattfw gateway when
# LITELLM_BASE_URL + LITELLM_API_KEY are set (shared/load-secrets.nix sources
# both from 1Password). Gateway models surface as `litellm/<name>` over the
# chat-completions wire; LiteLLM owns the per-model upstream specifics
# (Claude OAuth, the Codex/ChatGPT backend, OpenRouter), so OMP needs no
# per-upstream credentials for them.
#
# Codex via the gateway is the ChatGPT/Codex backend, which rejects the
# `system` role and accepts `developer`. Send `developer` for that one model
# so requests don't 400 — scoped to litellm/codex only; every other gateway
# model keeps default chat-completions shaping.
#
# Claude via the gateway rides the openai-completions wire as a bare
# `openai/…` passthrough, so LiteLLM discovery reports no `supports_reasoning`
# → the models are baked `reasoning: false` with no effort ladder, and OMP
# gates the thinking selector on both. Declare both per Claude model below:
# `reasoning: true` clears the gate; `thinking.mode: effort` supplies the
# minimal..xhigh ladder; and `compat` sends `reasoning_effort` (openai format),
# which the gateway maps to Claude's thinking budget. The selector defaults to
# off — a level is opt-in per session — so this adds the control without
# default spend.
providers:
  litellm:
    modelOverrides:
      codex:
        compat:
          supportsDeveloperRole: true
      claude-fable:
        reasoning: true
        thinking:
          mode: effort
          efforts: [minimal, low, medium, high, xhigh]
          defaultLevel: medium
        compat:
          supportsReasoningEffort: true
          thinkingFormat: openai
      claude-opus:
        reasoning: true
        thinking:
          mode: effort
          efforts: [minimal, low, medium, high, xhigh]
          defaultLevel: medium
        compat:
          supportsReasoningEffort: true
          thinkingFormat: openai
      claude-sonnet:
        reasoning: true
        thinking:
          mode: effort
          efforts: [minimal, low, medium, high, xhigh]
          defaultLevel: medium
        compat:
          supportsReasoningEffort: true
          thinkingFormat: openai
      claude-haiku:
        reasoning: true
        thinking:
          mode: effort
          efforts: [minimal, low, medium, high, xhigh]
          defaultLevel: medium
        compat:
          supportsReasoningEffort: true
          thinkingFormat: openai
