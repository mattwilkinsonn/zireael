# Wave coordination mesh — the zellij-spawner restart manifest (DATA, not Cotal source).
#
#   cotal up -f cotal.yaml            # fresh broker + channels + the whole wave, each agent
#                                     # placed into its lane tab via the zellij runtime
#   cotal up -f cotal.yaml --dry-run  # validate + print the plan, change nothing
#
# runtime: zellij makes the manager spawn every agent through the zellij runtime — each lands in
# its `placement.tab` (created on demand) as a stacked pane, instead of one fresh tab per agent.
# This is the config half of docs/designs/agents/zellij-runtime-placement.md (T8); the mechanism
# (placement seam, layout-map, KDL generator) lives on the Cotal fork branch zheng-zellij-runtime.
#
# SEED, never a frozen contract: the tab set is fluid (Matt's steer). Add service owners (one per
# svc.<name>, authored from _service-owner-template.md per README §6) and workers as the wave
# grows; placement.tab groups lanes into tabs many-to-one. layout-map.json (beside this file) is
# the fresh-boot layout seed, generated from the live dump via seedFromDump.
apiVersion: cotal/v1
kind: Mesh
space: wave

# Auth is the default (per-agent creds minted from the resolved policy below). The wave space is
# long-lived and rooted at ~/agents/workspaces.
broker:
  servers: nats://127.0.0.1:4222

# Every wave agent is an oh-my-pi (OMP) session — the connector this fork adds.
agent: oh-my-pi

runtime: zellij

agents:
  # The one standing supervisor — assignment authority + tracker owner. Its own single-pane tab,
  # matching the live `supervisor` tab.
  supervisor:
    persona: agents/supervisor.md
    placement:
      tab: supervisor

  # A concrete worker (proves the template fills in). Lands in a stacked lane tab — the live
  # `sealed/zireael` combined lane. Real workers are authored + added here as the supervisor
  # spins them up.
  worker-impl:
    persona: agents/worker-impl.md
    placement:
      tab: sealed/zireael
      stacked: true

  # A concrete service owner (svc.tern first point-of-contact). Service owners stack in the
  # `services` tab, matching the live 11-pane services stack. The other ten owners are authored
  # on demand (README §6) and added here the same way.
  tern:
    persona: agents/tern.md
    placement:
      tab: services
      stacked: true

channels:
  announcements:
    replay: true
    replayWindow: 24h
    description: Announcements only, supervisor-authored.
    instructions: Supervisor-authored announcements only (wave start/stop, new teammate, zone freezes). Assignments never happen here — they arrive by DM; state lives in the tracker. Read-only for workers.
    subscribe: [supervisor, worker-impl, tern]
    allowPublish: [supervisor]
  svc.petrel:
    replay: true
    replayWindow: 7d
    description: Petrel service channel — owner is first point-of-contact, reviewer, spec-owner.
    instructions: "@mention the petrel owner for a petrel incident/bugfix; post a PR touching oss/petrel/** here on start. The owner (dormant) wakes on mention."
  svc.tern:
    replay: true
    replayWindow: 7d
    description: Tern service channel — owner is first point-of-contact, reviewer, spec-owner.
    instructions: "@mention the tern owner for a tern incident/bugfix; post a PR touching oss/tern/** here on start. The owner (dormant) wakes on mention."
    subscribe: [tern]
    allowPublish: [supervisor, worker-impl, tern]
  svc.compass:
    replay: true
    replayWindow: 7d
    description: Compass service channel — owner is first point-of-contact, reviewer, spec-owner.
    instructions: "@mention the compass owner for a compass incident/bugfix; post a PR touching oss/compass/** here on start. The owner (dormant) wakes on mention."
  svc.seal:
    replay: true
    replayWindow: 7d
    description: Seal service channel — owner is first point-of-contact, reviewer, spec-owner.
    instructions: "@mention the seal owner for a seal incident/bugfix; post a PR touching oss/seal/** here on start. The owner (dormant) wakes on mention."
  svc.pulumi:
    replay: true
    replayWindow: 7d
    description: Pulumi (IaC) service channel — owner is first point-of-contact, reviewer, spec-owner.
    instructions: "@mention the pulumi owner for an infra/pulumi incident/bugfix; post a PR touching infra/pulumi/** here on start. The owner (dormant) wakes on mention."
  svc.nix-infra:
    replay: true
    replayWindow: 7d
    description: nix-infra (fleet/hosts) service channel — owner is first point-of-contact, reviewer, spec-owner.
    instructions: "@mention the nix-infra owner for an infra/nix fleet/host incident/bugfix; post a PR touching infra/nix/** (except woodpecker paths) here on start. The owner (dormant) wakes on mention."
  svc.ci-build:
    replay: true
    replayWindow: 7d
    description: ci-build service channel — owner is first point-of-contact, reviewer, spec-owner.
    instructions: "@mention the ci-build owner for a CI/build incident; post a PR touching ci/**, .moon/**, or the root bun workspace here on start. The owner (dormant) wakes on mention."
  svc.web:
    replay: true
    replayWindow: 7d
    description: web (site + docs) service channel — owner is first point-of-contact, reviewer, spec-owner.
    instructions: "@mention the web owner for a site/docs incident; post a PR touching apps/** here on start. The owner (dormant) wakes on mention."
  svc.omp:
    replay: true
    replayWindow: 7d
    description: omp (oh-my-pi fork) service channel — owner is first point-of-contact, reviewer, spec-owner.
    instructions: "@mention the omp owner for an oh-my-pi incident; post a PR in the oh-my-pi fork here on start (agent-posts path — no sealed/ CI backstop). The owner (dormant) wakes on mention."
  svc.cotal:
    replay: true
    replayWindow: 7d
    description: cotal (connector/mesh fork) service channel — owner is first point-of-contact, reviewer, spec-owner.
    instructions: "@mention the cotal owner for a connector/mesh incident; post a PR in the Cotal fork here on start (agent-posts path — no sealed/ CI backstop). The owner (dormant) wakes on mention."
  svc.woodpecker:
    replay: true
    replayWindow: 7d
    description: woodpecker (CI service, cross-repo) service channel — owner is first point-of-contact, reviewer, spec-owner.
    instructions: "@mention the woodpecker owner for a woodpecker/config-ext incident; post a PR touching the woodpecker fork, infra/nix/**/woodpecker*, or ci/woodpecker/** here on start. The owner (dormant) wakes on mention."
