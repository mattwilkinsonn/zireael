[revisions]
template = "builtin_log_compact"
# Single line: jjui's TOML reader doesn't strip leading whitespace from
# triple-quoted strings, so a multi-line revset breaks parsing.
#
# Three intentionally-separate sets unioned together:
#   1. `working_copies()` — `@` of every workspace sharing this
#      `.jj/`. Marker for "another agent is parked here"; needed
#      so the log shows sibling workspaces as standalone points.
#   2. `bookmarks()` — every bookmark as a LEAF (no range
#      expansion). Other workspaces' bookmark tips are visible,
#      but the commits BETWEEN them stay hidden.
#   3. `(bookmarks("main")..@) & (author(me))` — chain from
#      trunk to MY current `@`. This is the only range
#      expression; anchoring on `@` (current workspace only,
#      not `bookmarks()`) keeps sibling workspaces' in-flight
#      chains from leaking into my log.
#
# `parents(roots(...))` adds the trunk-side parent of my chain
# so the log displays the connection back to main.
revset = """working_copies() | bookmarks() | ((bookmarks("main")..@) & (author("matt@sealedsecurity.com") | author("mattwilki17@gmail.com"))) | parents(roots((bookmarks("main")..@) & (author("matt@sealedsecurity.com") | author("mattwilki17@gmail.com"))))"""

[[actions]]
name = "jj-gt-submit-selected"
lua = """
  jj_async("util", "exec", "--", "jj-gt", "submit", "-r", context.commit_id())
  revisions.refresh()
"""

[[actions]]
name = "jj-gt-fetch"
lua = """
  jj_async("util", "exec", "--", "jj-gt", "fetch")
  revisions.refresh()
"""

[[actions]]
name = "jj-gt-track-selected"
lua = """
  jj_async("util", "exec", "--", "jj-gt", "track", "-r", context.commit_id())
  revisions.refresh()
"""

[[actions]]
name = "jj-gt-submit"
lua = """
  jj_async("util", "exec", "--", "jj-gt", "submit", "--all")
  revisions.refresh()
"""

[[actions]]
name = "jj-gt-track"
lua = """
  jj_async("util", "exec", "--", "jj-gt", "track", "--all")
  revisions.refresh()
"""

[[actions]]
name = "jj-gt-reconcile"
lua = """
  jj_async("util", "exec", "--", "jj-gt", "reconcile")
  revisions.refresh()
"""

[[actions]]
name = "jj-gt-restack"
lua = """
  jj_async("util", "exec", "--", "jj-gt", "restack")
  revisions.refresh()
"""

[[bindings]]
action = "jj-gt-submit-selected"
seq = ["x", "s"]
scope = "revisions"
desc = "jj-gt submit stack ending at cursor"

[[bindings]]
action = "jj-gt-fetch"
seq = ["x", "f"]
scope = "revisions"
desc = "jj-gt fetch"

[[bindings]]
action = "jj-gt-track-selected"
seq = ["x", "t"]
scope = "revisions"
desc = "jj-gt track bookmarks on focused commit"


[[actions]]
name = "jj-hp-push-selected"
lua = """
  jj_async("util", "exec", "--", "jj-hp", "push", "-r", context.commit_id())
  revisions.refresh()
"""

[[actions]]
name = "jj-hp-push"
lua = """
  jj_async("util", "exec", "--", "jj-hp", "push", "--all")
  revisions.refresh()
"""

[[bindings]]
action = "jj-hp-push-selected"
seq = ["x", "p"]
scope = "revisions"
desc = "jj-hp push selected bookmark"

[[bindings]]
action = "jj-hp-push"
seq = ["x", "P"]
scope = "revisions"
desc = "jj-hp push every bookmark"

[[bindings]]
action = "jj-gt-submit"
seq = ["x", "S"]
scope = "revisions"
desc = "jj-gt submit every stack"

[[bindings]]
action = "jj-gt-track"
seq = ["x", "T"]
scope = "revisions"
desc = "jj-gt track every stack"

[[bindings]]
action = "jj-gt-reconcile"
seq = ["x", "r"]
scope = "revisions"
desc = "jj-gt reconcile"

[[bindings]]
action = "jj-gt-restack"
seq = ["x", "R"]
scope = "revisions"
desc = "jj-gt restack (rebase all local stacks onto trunk)"
