[revisions]
template = "builtin_log_compact"
# Single line: jjui's TOML reader doesn't strip leading whitespace from
# triple-quoted strings, so a multi-line revset breaks parsing.
revset = """present(@) | bookmarks("main") | ((bookmarks("main")..(bookmarks() | @)) & (author("matt@sealedsecurity.com") | author("mattwilki17@gmail.com"))) | parents(roots((bookmarks("main")..(bookmarks() | @)) & (author("matt@sealedsecurity.com") | author("mattwilki17@gmail.com"))))"""

[[actions]]
name = "jj-gt-submit-selected"
lua = """
  jj_async("util", "exec", "--", "jj-gt", "submit", "-r", context.commit_id())
  revisions.refresh()
"""

[[actions]]
name = "jj-gt-fetch"
lua = """
  jj_async("util", "exec", "--", "jj-gt", "fetch")
  revisions.refresh()
"""

[[actions]]
name = "jj-gt-track-selected"
lua = """
  jj_async("util", "exec", "--", "jj-gt", "track", "-r", context.commit_id())
  revisions.refresh()
"""

[[actions]]
name = "jj-gt-submit"
lua = """
  jj_async("util", "exec", "--", "jj-gt", "submit")
  revisions.refresh()
"""

[[actions]]
name = "jj-gt-track"
lua = """
  jj_async("util", "exec", "--", "jj-gt", "track")
  revisions.refresh()
"""

[[actions]]
name = "jj-gt-reconcile"
lua = """
  jj_async("util", "exec", "--", "jj-gt", "reconcile")
  revisions.refresh()
"""

[[bindings]]
action = "jj-gt-submit-selected"
seq = ["x", "s"]
scope = "revisions"
desc = "jj-gt submit selected bookmark(s)"

[[bindings]]
action = "jj-gt-fetch"
seq = ["x", "f"]
scope = "revisions"
desc = "jj-gt fetch"

[[bindings]]
action = "jj-gt-track-selected"
seq = ["x", "t"]
scope = "revisions"
desc = "jj-gt track selected bookmark(s)"


[[actions]]
name = "jj-hp-push-selected"
lua = """
  jj_async("util", "exec", "--", "jj-hp", "push", "-r", context.commit_id())
  revisions.refresh()
"""

[[actions]]
name = "jj-hp-push"
lua = """
  jj_async("util", "exec", "--", "jj-hp", "push")
  revisions.refresh()
"""

[[bindings]]
action = "jj-hp-push-selected"
seq = ["x", "p"]
scope = "revisions"
desc = "jj-hp push selected bookmark(s)"

[[bindings]]
action = "jj-hp-push"
seq = ["x", "P"]
scope = "revisions"
desc = "jj-hp push"

[[bindings]]
action = "jj-gt-submit"
seq = ["x", "S"]
scope = "revisions"
desc = "jj-gt submit (whole stack)"

[[bindings]]
action = "jj-gt-track"
seq = ["x", "T"]
scope = "revisions"
desc = "jj-gt track (whole stack)"

[[bindings]]
action = "jj-gt-reconcile"
seq = ["x", "r"]
scope = "revisions"
desc = "jj-gt reconcile"
