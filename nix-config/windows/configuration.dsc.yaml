# yaml-language-server: $schema=https://aka.ms/configuration-dsc-schema/0.2
#
# Declarative Windows app installs via `winget configure`.
# Run from scripts/windows-setup.ps1.
#
# Scope: gaming-focused install. Linux is the dev box; only the minimum dev
# tooling needed for "ssh in / quick edit / clone dotfiles" lives here.
#
# Apps grouped by category for readability — winget runs them in declared order.
# Apps that aren't winget-manageable (NVIDIA App, Overwolf, Divvy, WinDisplay,
# Insights Capture) are printed as manual-install reminders by the setup script.

properties:
  configurationVersion: 0.2.0

  resources:

    # ─── Dev tools ──────────────────────────────────────────────────────────
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: git
      directives: { description: Git }
      settings: { id: Git.Git, source: winget }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: jj
      directives: { description: Jujustu }
      settings: { id: jj-vcs.jj, source: winget }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: jjui
      directives: { description: jjui }
      settings: { id: IbrahimDursun.jjui, source: winget }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: gh
      directives: { description: GitHub CLI }
      settings: { id: GitHub.cli, source: winget }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: vscode
      directives: { description: Visual Studio Code }
      settings: { id: Microsoft.VisualStudioCode, source: winget }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: python
      directives: { description: Python 3.14 }
      settings: { id: Python.Python.3.14, source: winget }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: rustup
      directives: { description: Rustup toolchain installer }
      settings: { id: Rustlang.Rustup, source: winget }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: btm
      directives: { description: bottom (btm) — TUI system monitor }
      settings: { id: Clement.bottom, source: winget }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: podman-desktop
      directives: { description: Podman Desktop }
      settings: { id: RedHat.Podman-Desktop, source: winget }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: rclone
      directives: { description: rclone }
      settings: { id: rclone.rclone, source: winget }

    # ─── Productivity ───────────────────────────────────────────────────────
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: 1password
      directives: { description: 1Password }
      settings: { id: AgileBits.1Password, source: winget }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: 1password-cli
      directives: { description: 1Password CLI }
      settings: { id: AgileBits.1Password.CLI, source: winget }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: obsidian
      directives: { description: Obsidian }
      settings: { id: Obsidian.Obsidian, source: winget }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: claude
      directives: { description: Claude desktop }
      settings: { id: Anthropic.Claude, source: winget }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: spotify
      directives: { description: Spotify }
      settings: { id: Spotify.Spotify, source: winget }
    
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: akiflow
      directives: { description: Akiflow }
      settings: { id: Akiflow.Akiflow, source: winget }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: arc
      directives: { description: Arc browser }
      settings: { id: TheBrowserCompany.Arc, source: winget }
    
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: chrome
      directives: { description: Chrome browser }
      settings: { id: Google.Chrome, source: winget }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: gdrive
      directives: { description: Google Drive }
      settings: { id: Google.GoogleDrive, source: winget }

    # ─── Utilities ──────────────────────────────────────────────────────────
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: 7zip
      directives: { description: 7-Zip }
      settings: { id: 7zip.7zip, source: winget }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: powertoys
      directives: { description: PowerToys }
      settings: { id: Microsoft.PowerToys, source: winget }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: ahk
      directives: { description: AutoHotkey v2 }
      settings: { id: AutoHotkey.AutoHotkey, source: winget }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: tailscale
      directives: { description: Tailscale }
      settings: { id: Tailscale.Tailscale, source: winget }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: explorerpatcher
      directives: { description: ExplorerPatcher }
      settings: { id: valinet.ExplorerPatcher, source: winget }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: qalculate
      directives: { description: Qalculate }
      settings: { id: Qalculate.Qalculate, source: winget }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: treesize
      directives: { description: TreeSize Free }
      settings: { id: JAMSoftware.TreeSize.Free, source: winget }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: rufus
      directives: { description: Rufus }
      settings: { id: Rufus.Rufus, source: winget }

    # RustDesk: pulled from winget (flagged PUA). Install manually from
    # https://rustdesk.com/ -- listed in the manual-install reminders in
    # windows-setup.ps1. Re-enable here if it's ever re-added to winget.
    # - resource: Microsoft.WinGet.DSC/WinGetPackage
    #   id: rustdesk
    #   directives: { description: RustDesk }
    #   settings: { id: RustDesk.RustDesk, source: winget }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: keyboardtest
      directives: { description: PassMark KeyboardTest }
      settings: { id: PassMark.KeyboardTest, source: winget }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: displayfusion
      directives: { description: DisplayFusion }
      settings: { id: BinaryFortress.DisplayFusion, source: winget }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: tcno
      directives: { description: TcNo Account Switcher }
      settings: { id: TechNobo.TcNoAccountSwitcher, source: winget }

    # ─── Gaming ─────────────────────────────────────────────────────────────
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: steam
      directives: { description: Steam }
      settings: { id: Valve.Steam, source: winget }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: ea
      directives: { description: EA Desktop }
      settings: { id: ElectronicArts.EADesktop, source: winget }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: discord
      directives: { description: Discord }
      settings: { id: Discord.Discord, source: winget }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: lol
      directives: { description: League of Legends (NA) }
      settings: { id: RiotGames.LeagueOfLegends.NA, source: winget }

    # Valorant: winget manifest hash drifts behind the live installer
    # (DownloadError every time). Install via the Riot Client (already
    # there from League of Legends) or https://playvalorant.com/.
    # - resource: Microsoft.WinGet.DSC/WinGetPackage
    #   id: valorant
    #   directives: { description: Valorant (NA) }
    #   settings: { id: RiotGames.Valorant.NA, source: winget }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: ps-accessories
      directives: { description: PlayStation Accessories }
      settings: { id: PlayStation.PlayStationAccessories, source: winget }

    # ─── Hardware / drivers / monitoring ────────────────────────────────────
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: hwinfo
      directives: { description: HWiNFO }
      settings: { id: REALiX.HWiNFO, source: winget }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: afterburner
      directives: { description: MSI Afterburner }
      settings: { id: Guru3D.Afterburner, source: winget }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: rtss
      directives: { description: Rivatuner Statistics Server }
      settings: { id: Guru3D.RTSS, source: winget }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: icue
      directives: { description: Corsair iCUE 5 }
      settings: { id: Corsair.iCUE.5, source: winget }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: ghub
      directives: { description: Logitech G HUB }
      settings: { id: Logitech.GHUB, source: winget }
    
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: fancontrol
      directives: { description: FanControl }
      settings: { id: Rem0o.FanControl, source: winget }

    # Intel XTU: the patch version pinned in winget was pulled from Intel's
    # download server and the manifest hasn't been updated. Install from
    # https://www.intel.com/content/www/us/en/download/17881/intel-extreme-tuning-utility-intel-xtu.html
    # - resource: Microsoft.WinGet.DSC/WinGetPackage
    #   id: xtu
    #   directives: { description: Intel Extreme Tuning Utility }
    #   settings: { id: Intel.IntelExtremeTuningUtility, source: winget }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: intel-dsa
      directives: { description: Intel Driver and Support Assistant }
      settings: { id: Intel.IntelDriverAndSupportAssistant, source: winget }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: intel-pdt
      directives: { description: Intel Processor Diagnostic Tool }
      settings: { id: Intel.ProcessorDiagnosticTool, source: winget }

    # ─── MS Store apps ──────────────────────────────────────────────────────
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: msi-center
      directives: { description: MSI Center }
      settings: { id: 9NVMNJCR03XV, source: msstore }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: nvidia-cp
      directives: { description: NVIDIA Control Panel }
      settings: { id: 9NF8H0H7WMLT, source: msstore }

    # ─── System ─────────────────────────────────────────────────────────────
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: wsl
      directives: { description: Windows Subsystem for Linux }
      settings: { id: Microsoft.WSL, source: winget }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: autologon
      directives: { description: Sysinternals Autologon }
      settings: { id: Microsoft.Sysinternals.Autologon, source: winget }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: terminal
      directives: { description: Windows Terminal }
      settings: { id: Microsoft.WindowsTerminal, source: winget }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: godot-launcher
      directives: { description: Godot Launcher }
      settings: { id: GodotLauncher.Launcher, source: winget }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: rpi-imager
      directives: { description: Raspberry Pi Imager }
      settings: { id: RaspberryPiFoundation.RaspberryPiImager, source: winget }
