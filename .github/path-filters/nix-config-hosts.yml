# ─── Darwin hosts ────────────────────────────────────────────────────

# Matts-MacBook-Pro (aarch64 darwin, unstable-wholesale stack).
darwin-mbp:
  - 'nix-config/flake.nix'
  - 'nix-config/flake.lock'
  - 'nix-config/shared/home.nix'
  - 'nix-config/shared/dev.nix'
  - 'nix-config/shared/load-secrets.nix'
  - 'nix-config/shared/unstable-wholesale.nix'
  - 'nix-config/shared/overlays-master.nix'
  - 'nix-config/shared/dotfiles/**'
  - 'nix-config/darwin/home.nix'
  - 'nix-config/darwin/system.nix'
  - '.github/workflows/nix-config.yml'
  - '.github/workflows/ci-base-nix.yml'
  - '.github/path-filters/nix-config.yml'
  - '.github/path-filters/nix-config-hosts.yml'

# mattmini (aarch64 darwin, stable nix-darwin + stable nixpkgs-darwin
# stack). Distinct from Matts-MacBook-Pro: separate `pkgs` constructed
# inline in flake.nix with its own overlay (jjFromUnstable), and the
# user import set only carries shared/home.nix (not shared/dev.nix or
# shared/load-secrets.nix — this is a CI runner, not a dev box).
mattmini:
  - 'nix-config/flake.nix'
  - 'nix-config/flake.lock'
  - 'nix-config/shared/home.nix'
  - 'nix-config/shared/dotfiles/**'
  - 'nix-config/darwin/mattmini/**'
  - 'nix-config/darwin/modules/buildkite-agent-macos.nix'
  - '.github/workflows/nix-config.yml'
  - '.github/workflows/ci-base-nix.yml'
  - '.github/path-filters/nix-config.yml'
  - '.github/path-filters/nix-config-hosts.yml'

# awsmac (aarch64 darwin) — EC2 mac2-m2.metal, most-disposable stopgap
# macOS CI runner. Same stable-darwin stack + import set as mattmini;
# distinct host dir + flake entry (account is ec2-user).
awsmac:
  - 'nix-config/flake.nix'
  - 'nix-config/flake.lock'
  - 'nix-config/shared/home.nix'
  - 'nix-config/shared/dotfiles/**'
  - 'nix-config/darwin/awsmac/**'
  - 'nix-config/darwin/modules/buildkite-agent-macos.nix'
  - '.github/workflows/nix-config.yml'
  - '.github/workflows/ci-base-nix.yml'
  - '.github/path-filters/nix-config.yml'
  - '.github/path-filters/nix-config-hosts.yml'
