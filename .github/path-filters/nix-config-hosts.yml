# Per-host nix-config path filters.
#
# `nix-config.yml` runs dorny/paths-filter against this and gates each
# flake-eval-<host> job on the matching output. Goal: skip flake eval
# for hosts not affected by the PR's diff, save GitHub Actions minutes.
#
# Filters are deliberately explicit (no YAML anchors) since
# dorny/paths-filter's nested-sequence semantics aren't friendly to
# anchor-spreading. The redundancy is the cost of clarity; when
# updating, propagate shared changes by hand and rely on actionlint
# / the file's own self-reference at the bottom of each filter to
# catch drift.
#
# Liberal on purpose. False positives (running eval when strictly not
# needed) are cheap relative to the cost of missing a regression.
#
# Anchors that always trigger every host:
#   - nix-config/flake.nix / flake.lock — fan-out by definition.
#   - nix-config/shared/home.nix — imported by every host's home-manager
#     user config; a typo can break all of them.
#   - nix-config/shared/dotfiles/** — symlink targets for home.file
#     declarations in shared/home.nix and darwin/home.nix.
#   - this filter file itself + the workflow + ci-base-nix.yml (so edits
#     to the gating logic fire the gates).
#
# Lint-only files (statix.toml, .gitignore, .markdownlint.jsonc,
# 1password.md) don't trigger any host — they affect linting and docs,
# not flake eval. Per-host install docs (nix-config/{host}/INSTALL.md)
# do trigger that host (markdownlint catches them via the docs filter,
# but content drift could surface assumptions about the host config).

# ─── Linux hosts ─────────────────────────────────────────────────────

# rpi4 — minimal (no dev tooling, no desktop, no overlays).
rpi4:
  - 'nix-config/flake.nix'
  - 'nix-config/flake.lock'
  - 'nix-config/shared/home.nix'
  - 'nix-config/shared/linux.nix'
  - 'nix-config/shared/dotfiles/**'
  - 'nix-config/nixos/common.nix'
  - 'nix-config/nixos/home.nix'
  - 'nix-config/nixos/rpi4/**'
  - '.github/workflows/nix-config.yml'
  - '.github/workflows/ci-base-nix.yml'
  - '.github/path-filters/nix-config.yml'
  - '.github/path-filters/nix-config-hosts.yml'

# rpi5 — has shared/overlays.nix (jj from unstable) on top of linux.
rpi5:
  - 'nix-config/flake.nix'
  - 'nix-config/flake.lock'
  - 'nix-config/shared/home.nix'
  - 'nix-config/shared/linux.nix'
  - 'nix-config/shared/overlays.nix'
  - 'nix-config/shared/dotfiles/**'
  - 'nix-config/nixos/common.nix'
  - 'nix-config/nixos/home.nix'
  - 'nix-config/nixos/rpi5/**'
  - '.github/workflows/nix-config.yml'
  - '.github/workflows/ci-base-nix.yml'
  - '.github/path-filters/nix-config.yml'
  - '.github/path-filters/nix-config-hosts.yml'

# mattserver — same overlay set as rpi5, plus load-secrets, dev tooling.
mattserver:
  - 'nix-config/flake.nix'
  - 'nix-config/flake.lock'
  - 'nix-config/shared/home.nix'
  - 'nix-config/shared/linux.nix'
  - 'nix-config/shared/dev.nix'
  - 'nix-config/shared/overlays.nix'
  - 'nix-config/shared/load-secrets.nix'
  - 'nix-config/shared/dotfiles/**'
  - 'nix-config/nixos/common.nix'
  - 'nix-config/nixos/home.nix'
  - 'nix-config/nixos/modules/buildkite-agent.nix'
  - 'nix-config/nixos/mattserver/**'
  - '.github/workflows/nix-config.yml'
  - '.github/workflows/ci-base-nix.yml'
  - '.github/path-filters/nix-config.yml'
  - '.github/path-filters/nix-config-hosts.yml'

# mattlinuxpro — converted 2013 trashcan Mac Pro, headless Buildkite CI
# runner (SEA-839). Minimal import set (no dev/load-secrets), plus the
# shared buildkite-agent module it consumes.
mattlinuxpro:
  - 'nix-config/flake.nix'
  - 'nix-config/flake.lock'
  - 'nix-config/shared/home.nix'
  - 'nix-config/shared/linux.nix'
  - 'nix-config/shared/overlays.nix'
  - 'nix-config/shared/dotfiles/**'
  - 'nix-config/nixos/common.nix'
  - 'nix-config/nixos/home.nix'
  - 'nix-config/nixos/modules/buildkite-agent.nix'
  - 'nix-config/nixos/mattlinuxpro/**'
  - '.github/workflows/nix-config.yml'
  - '.github/workflows/ci-base-nix.yml'
  - '.github/path-filters/nix-config.yml'
  - '.github/path-filters/nix-config-hosts.yml'

# mattfw — full dev stack (unstable wholesale, dev, linux-build-deps,
