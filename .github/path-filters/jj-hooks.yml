# Path filter for jj-hooks. Consumed by:
# - `.github/workflows/jj-hooks.yml` (remote CI, via dorny/paths-filter)
# - `just ci` locally (via the root Justfile's `_filter-touched` helper)
#
# Same single-source-of-truth pattern seal uses — edits to the
# filter file fire its own workflow's `changes` job, so the filter
# logic itself is exercised on every change to it.
#
# Liberal on purpose. False positives (running clippy/tests when
# strictly not needed) are cheap; false negatives ship regressions.
jj-hooks:
  - 'tools/jj-hooks/**'
  - 'Cargo.toml'
  - 'Cargo.lock'
  - 'rust-toolchain.toml'
  - 'clippy.toml'
  - 'hk.pkl'
  - '.github/workflows/jj-hooks.yml'
  - '.github/workflows/ci-base-rust.yml'
  - '.github/path-filters/jj-hooks.yml'
