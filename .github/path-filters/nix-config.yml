# Path filter for the nix-config change gate.
# Consumed by `.github/workflows/ci.yml` (dorny/paths-filter) to decide
# whether the macOS darwin-flake-eval leg runs — a non-nix PR skips the
# (costly) macOS runner. The full moon gate on Linux runs regardless.
#
# Liberal on purpose. False positives (spawning the macOS leg when
# strictly not needed) are cheap; false negatives ship a darwin regression.
nix-config:
  - 'nix-config/**'
  - '.github/workflows/ci.yml'
  - '.github/path-filters/nix-config.yml'
