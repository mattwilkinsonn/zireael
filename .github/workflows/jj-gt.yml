name: jj-gt

"on":
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  optimize_ci:
    name: Optimize CI
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      actions: write
    timeout-minutes: 2
    outputs:
      skip: ${{ steps.check_skip.outputs.skip }}
    steps:
      - id: check_skip
        uses: withgraphite/graphite-ci-action@26bc0dcdeaba101794931d67a464ecbb21a76a8b # v0.0.9
        with:
          graphite_token: ${{ secrets.GRAPHITE_TOKEN }}

  changes:
    name: Detect jj-gt Changes
    needs: [optimize_ci]
    if: needs.optimize_ci.outputs.skip == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 3
    outputs:
      changed: ${{ steps.filter.outputs.jj-gt }}
    steps:
      - uses: actions/checkout@v6
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: .github/path-filters/jj-gt.yml

  # See jj-hooks.yml for the rationale on the dispatch + rollup split.
  ci-dispatch:
    name: jj-gt (matrix)
    needs: [optimize_ci, changes]
    if: |
      needs.optimize_ci.outputs.skip == 'false' &&
      needs.changes.outputs.changed == 'true'
    uses: ./.github/workflows/ci-base-rust.yml
    with:
      package: jj-gt
      install_deps: true
    secrets: inherit

  # Single stable check context for branch protection (`jj-gt CI`).
  # Mirrors jj-hooks.yml's rollup.
  ci:
    name: jj-gt CI
    needs: [optimize_ci, changes, ci-dispatch]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Rollup ci-dispatch result
        run: |
          set -euo pipefail
          result='${{ needs.ci-dispatch.result }}'
          case "$result" in
            success|skipped)
              echo "ci-dispatch reported $result — pass"
              ;;
            *)
              echo "ci-dispatch reported $result — fail" >&2
              exit 1
              ;;
          esac
