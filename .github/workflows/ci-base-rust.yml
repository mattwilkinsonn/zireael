name: Rust CI base

# Reusable workflow consumed by .github/workflows/jj-hooks.yml and
# .github/workflows/jj-gt.yml. Single source of truth for the Rust
# lint/test scaffold across all Rust members of the monorepo.
#
# Caller pattern:
#
#   ci:
#     needs: [changes]
#     if: needs.changes.outputs.changed == 'true'
#     uses: ./.github/workflows/ci-base-rust.yml
#     with:
#       package: jj-hooks
#       install_deps: true

"on":
  workflow_call:
    inputs:
      package:
        description: "Cargo package name to lint + test (e.g. jj-hooks)"
        required: true
        type: string
      install_deps:
        description: "Install the package's integration-test tools (jj-hooks: hook-runner stack; jj-gt: Graphite CLI)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lints:
    name: Lints (${{ inputs.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install stable
          rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "lints-${{ inputs.package }}"
          save-if: "true"

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      # Checks are defined once as justfile recipes and invoked directly
      # (mirrors seal: CI runs `just <recipe>`; hk mirrors them inline).
      - name: Format check
        run: just fmt-pkg ${{ inputs.package }}

      - name: Clippy
        run: just clippy-pkg ${{ inputs.package }}

  test:
    name: Test (${{ inputs.package }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      # install_deps steps drop per-tool binaries into XDG_BIN_HOME, a
      # workspace-scoped dir. It ends in `/bin` so
      # `npm config set prefix "$(dirname "$XDG_BIN_HOME")"` lands npm
      # globals (markdownlint-cli2, gt) in XDG_BIN_HOME too. XDG_DATA_HOME
      # keeps uv's tool data workspace-scoped rather than in $HOME.
      XDG_BIN_HOME: ${{ github.workspace }}/.tools/bin
      XDG_DATA_HOME: ${{ github.workspace }}/.tools/data
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "test-${{ inputs.package }}-${{ matrix.os }}"
          save-if: "true"

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,just,cargo-binstall

      # Per-tool test binaries: jj-hooks needs the hook-runner stack
      # (pre-commit, prek, lefthook, hk, pkl, markdownlint-cli2,
      # actionlint); jj-gt needs the Graphite CLI (gt). Installed fresh
      # every run — deliberately NOT cached. A content-addressed cache
      # keyed on this workflow file froze the tool set for weeks (a stale
      # `pre-commit` went missing from the blob and the cache never
      # refreshed because the YAML was untouched), defeating the
      # nightly's whole purpose as a drift detector. The install cost is
      # a bounded ~30-60s; correctness wins.
      - name: Install latest jj
        if: inputs.install_deps
        run: |
          set -euo pipefail
          # Resolve the latest jj release so PR + nightly both catch jj
          # CLI drift the day it ships, rather than hiding behind a pin.
          jj_version=$(curl -fsSL https://api.github.com/repos/jj-vcs/jj/releases/latest \
            | grep '"tag_name"' | head -1 | sed -E 's/.*"tag_name": *"([^"]+)".*/\1/')
          if [ -z "$jj_version" ]; then
            echo "could not resolve latest jj release tag" >&2
            exit 1
          fi
          case "$(uname -s)-$(uname -m)" in
              Linux-x86_64)   triple=x86_64-unknown-linux-musl ;;
              Linux-aarch64)  triple=aarch64-unknown-linux-musl ;;
              Darwin-arm64)   triple=aarch64-apple-darwin ;;
              Darwin-x86_64)  triple=x86_64-apple-darwin ;;
              *)
                  echo "unsupported host: $(uname -s)-$(uname -m)" >&2
                  exit 1
                  ;;
          esac
          url="https://github.com/jj-vcs/jj/releases/download/${jj_version}/jj-${jj_version}-${triple}.tar.gz"
          dest="${XDG_BIN_HOME:-$HOME/.local/bin}"
          mkdir -p "$dest"
          curl -fsSL "$url" | tar -xz --strip-components=1 -C "$dest" ./jj
          "$dest/jj" --version

      - name: Install Python (for uv on Linux)
        if: inputs.install_deps && runner.os == 'Linux'
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install uv (Linux only — macOS uses brew)
        if: inputs.install_deps && runner.os == 'Linux'
        uses: astral-sh/setup-uv@v6

      # jj-hooks's integration tests drive real hook frameworks, so they
      # need the hook-runner stack on PATH. Pinned release tarballs / uv /
      # npm / binstall, all into XDG_BIN_HOME. Keep versions in sync with
      # the Justfile `_install-deps-jj-hooks` recipe (its local-dev twin).
      - name: Install jj-hooks hook stack
        if: inputs.install_deps && inputs.package == 'jj-hooks'
        run: |
          set -euo pipefail
          case "$(uname -s)" in
            Darwin)
              brew install pre-commit prek lefthook hk pkl markdownlint-cli2 actionlint
              ;;
            Linux)
              mkdir -p "$XDG_BIN_HOME"
              uv tool install pre-commit
              uv tool install prek
              case "$(uname -m)" in
                x86_64)  lh=x86_64; al=amd64; pk=amd64 ;;
                aarch64) lh=arm64;  al=arm64; pk=aarch64 ;;
                *) echo "unsupported arch $(uname -m)" >&2; exit 1 ;;
              esac
              curl -fsSL "https://github.com/evilmartians/lefthook/releases/download/v2.1.6/lefthook_2.1.6_Linux_${lh}" -o "$XDG_BIN_HOME/lefthook"
              chmod +x "$XDG_BIN_HOME/lefthook"
              curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_${al}.tar.gz" | tar -xz -C "$XDG_BIN_HOME" actionlint
              curl -fsSL "https://github.com/apple/pkl/releases/download/0.31.1/pkl-linux-${pk}" -o "$XDG_BIN_HOME/pkl"
              chmod +x "$XDG_BIN_HOME/pkl"
              npm config set prefix "$(dirname "$XDG_BIN_HOME")"
              npm install -g markdownlint-cli2
              cargo binstall -y --install-path "$XDG_BIN_HOME" hk
              ;;
          esac

      # jj-gt's tests shell out to the Graphite CLI (gt), from npm.
      - name: Install Graphite CLI (gt)
        if: inputs.install_deps && inputs.package == 'jj-gt'
        run: |
          set -euo pipefail
          mkdir -p "$XDG_BIN_HOME"
          npm config set prefix "$(dirname "$XDG_BIN_HOME")"
          npm install -g @withgraphite/graphite-cli

      - name: Add tool dirs to PATH
        if: inputs.install_deps
        run: echo "$XDG_BIN_HOME" >> "$GITHUB_PATH"

      - name: Tests
        run: just nextest-${{ inputs.package }}
