name: post-merge

# Cheap post-merge sanity checks on `push: main`. The full PR-time
# matrix already ran against the PR head, but a squash-merge creates
# a new commit on main with a new SHA — we don't have a dedup-against-
# PR mechanism (would need GitHub API calls per commit). The pragmatic
# answer: run the cheap subset only (lints + smoke checks), let the
# nightly catch heavier drift at 24h cadence.
#
# What runs here:
#
#   - fmt + clippy on every Rust package (~1min warm-cache)
#   - biome + tsc on akiflow-cli (skips `bun test` — that's the
#     slow part)
#   - markdownlint on every .md
#   - brew style on Formula/*.rb (~5s on macos)
#
# What does NOT run here (relies on the PR's check set + nightly):
#
#   - `cargo nextest run` across both Rust crates × two OSes
#   - `bun test` for akiflow-cli (~290 tests, 5min p95)
#
# Rationale: post-merge CI catches "main is broken now" within a
# minute, the nightly catches "main was broken yesterday by an
# upstream change" within 24h. The expensive PR-time gate isn't
# duplicated.

"on":
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-lints:
    name: Rust lints (post-merge)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install stable
          rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "post-merge-rust-lints"
          save-if: "true"
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        # Single workspace-wide clippy invocation. Both jj-hooks
        # and jj-gt are members; this lints them in one pass.
        run: cargo clippy --workspace --all-targets -- -D warnings

  akiflow-cli-lints:
    name: akiflow-cli lints (post-merge)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: tools/akiflow-cli
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - name: bun install
        run: bun install --frozen-lockfile
      - name: biome check
        run: bunx biome check .
      - name: tsc --noEmit
        run: bunx tsc --noEmit

  docs:
    name: docs (post-merge)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - run: npm install -g markdownlint-cli2
      - run: markdownlint-cli2 "**/*.md"

  tap:
    name: tap (post-merge)
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - run: brew style Formula/*.rb
