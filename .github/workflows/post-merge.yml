name: post-merge

# Post-merge sanity check on `push: main`. A squash-merge creates a new
# commit on main with a new SHA, so this re-runs the moon gate scoped to
# the merge diff to confirm the squashed commit is actually green (the PR
# ran against the PR head, not this SHA).
#
# `moon ci` here is affected-scoped to the pushed range (before..after),
# so it runs only what the merge touched — not the whole suite. The
# darwin flake-eval self-skips on Linux (os:macos); the nightly's macOS
# leg covers it at 24h cadence, which is sufficient for a post-merge
# smoke check.

"on":
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write # Determinate Nix (devenv) needs OIDC

jobs:
  moon-ci:
    name: moon ci (post-merge)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The pushed range: the previous main tip .. the new (squash-merge)
      # tip. moon scopes affected tasks to this diff.
      MOON_BASE: ${{ github.event.before }}
      MOON_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # moon affected-detection needs the range history
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: Cache proto toolchains
        uses: actions/cache@v4
        with:
          path: ~/.proto
          key: proto-${{ runner.os }}-${{ hashFiles('.prototools') }}
      - name: Install devenv
        run: nix profile install --accept-flake-config nixpkgs#devenv
      - name: moon ci
        run: devenv shell -- moon ci
