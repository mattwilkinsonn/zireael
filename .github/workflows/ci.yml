name: ci

# The unified moon gate. One workflow runs `moon ci` (every affected
# runInCI moon task) inside the devenv shell — the same command the hk
# pre-push hook runs locally. The single gate for PRs — the `main` ruleset
# requires the `moon CI` rollup below.
#
# proto (from devenv) installs the pinned bun/node/moon on shell entry;
# moon then execs the devenv PATH toolchain (system tasks). The darwin
# flake-eval runs on a macOS leg (nix-darwin attrs are macOS-only) and
# only when nix-config changes, so a typical PR pays no macOS minutes.

"on":
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # DeterminateSystems/determinate-nix-action needs OIDC

jobs:
  optimize_ci:
    name: Optimize CI
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      actions: write # for graphite-ci-action's cancelWorkflowRun call
    timeout-minutes: 2
    outputs:
      skip: ${{ steps.check_skip.outputs.skip }}
    steps:
      - id: check_skip
        uses: withgraphite/graphite-ci-action@26bc0dcdeaba101794931d67a464ecbb21a76a8b # v0.0.9
        with:
          graphite_token: ${{ secrets.GRAPHITE_TOKEN }}

  # ─── Detect ────────────────────────────────────────────────────────
  # Gate the macOS darwin-eval leg on nix-config changes so a non-nix PR
  # never spawns an (expensive) macOS runner.

  changes:
    name: Detect nix-config Changes
    needs: [optimize_ci]
    if: needs.optimize_ci.outputs.skip == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 3
    outputs:
      nix-config: ${{ steps.filter.outputs.nix-config }}
    steps:
      - uses: actions/checkout@v6
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: .github/path-filters/nix-config.yml

  # ─── moon ci (linux) ───────────────────────────────────────────────
  # The full gate. `moon ci` runs every affected runInCI task; the
  # darwin flake-eval self-skips here (os:macos). Base/head come from the
  # PR so moon scopes to the diff.

  moon-ci:
    name: moon ci (linux)
    needs: [optimize_ci]
    if: needs.optimize_ci.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MOON_BASE: ${{ github.event.pull_request.base.sha }}
      MOON_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # moon affected-detection needs base + head history
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: Cache proto toolchains
        uses: actions/cache@v4
        with:
          path: ~/.proto
          key: proto-${{ runner.os }}-${{ hashFiles('.prototools') }}
      - name: Install devenv
        run: nix profile install --accept-flake-config nixpkgs#devenv
      - name: moon ci
        run: devenv shell -- moon ci

  # ─── moon ci (darwin eval) ─────────────────────────────────────────
  # macOS-only leg: runs just the darwin host's flake-eval (nix-darwin
  # attrs don't evaluate off-macOS). Gated on nix-config changes.

  moon-ci-darwin:
    name: moon ci (darwin eval)
    needs: [optimize_ci, changes]
    if: |
      needs.optimize_ci.outputs.skip == 'false' &&
      needs.changes.outputs.nix-config == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: Cache proto toolchains
        uses: actions/cache@v4
        with:
          path: ~/.proto
          key: proto-${{ runner.os }}-${{ hashFiles('.prototools') }}
      - name: Install devenv
        run: nix profile install --accept-flake-config nixpkgs#devenv
      - name: moon run nix-config:flake-eval-darwin
        run: devenv shell -- moon run nix-config:flake-eval-darwin

  # ─── Rollup gate ────────────────────────────────────────────────────
  # Single stable check context for branch protection (`moon CI`). A
  # failure in either leg fails the gate; a skip (graphite skip, or the
  # darwin leg on a non-nix PR) passes.

  ci:
    name: moon CI
    needs:
      - optimize_ci
      - changes
      - moon-ci
      - moon-ci-darwin
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Rollup upstream jobs
        run: |
          set -euo pipefail
          # Each upstream job reports one of: success, failure, cancelled, skipped.
          # success/skipped → contribute pass; failure/cancelled → fail the gate.
          declare -A results=(
            [changes]='${{ needs.changes.result }}'
            [moon-ci]='${{ needs.moon-ci.result }}'
            [moon-ci-darwin]='${{ needs.moon-ci-darwin.result }}'
          )
          failed=0
          for job in "${!results[@]}"; do
            result="${results[$job]}"
            case "$result" in
              success|skipped) echo "✓ $job: $result" ;;
              *) echo "✗ $job: $result" >&2; failed=1 ;;
            esac
          done
          if [ "$failed" -ne 0 ]; then
            echo "one or more upstream jobs failed — see above" >&2
            exit 1
          fi
          echo "all upstream jobs passed or were skipped"
