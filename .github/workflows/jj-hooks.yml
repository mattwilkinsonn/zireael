name: jj-hooks

"on":
  pull_request:

# Per-tool concurrency: a fixup push to a PR cancels in-flight runs
# for the same PR but doesn't disturb other PRs' jj-hooks runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  optimize_ci:
    name: Optimize CI
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      actions: write  # for graphite-ci-action's cancelWorkflowRun call
    timeout-minutes: 2
    outputs:
      skip: ${{ steps.check_skip.outputs.skip }}
    steps:
      - id: check_skip
        uses: withgraphite/graphite-ci-action@26bc0dcdeaba101794931d67a464ecbb21a76a8b # v0.0.9
        with:
          graphite_token: ${{ secrets.GRAPHITE_TOKEN }}

  changes:
    name: Detect jj-hooks Changes
    needs: [optimize_ci]
    if: needs.optimize_ci.outputs.skip == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 3
    outputs:
      changed: ${{ steps.filter.outputs.jj-hooks }}
    steps:
      - uses: actions/checkout@v6
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: .github/path-filters/jj-hooks.yml

  # The dispatch job invokes the reusable workflow. Its display name
  # (`jj-hooks (matrix)`) becomes the prefix for the reusable's children
  # in PR checks: `jj-hooks (matrix) / Lints (jj-hooks)`, etc.
  #
  # Branch protection does NOT gate on this job directly — see the
  # `ci` rollup below for the stable check context.
  ci-dispatch:
    name: jj-hooks (matrix)
    needs: [optimize_ci, changes]
    if: |
      needs.optimize_ci.outputs.skip == 'false' &&
      needs.changes.outputs.changed == 'true'
    uses: ./.github/workflows/ci-base-rust.yml
    with:
      package: jj-hooks
      install_deps: true
    secrets: inherit

  # Windows coverage. jj-hooks shells out to `git worktree add` with a
  # `--git-dir` it resolves via canonicalize(); on Windows that yields a
  # `\\?\` verbatim path git-for-windows rejects, so the worktree path
  # handling has to be exercised on a real Windows host (the Unix matrix
  # in ci-base-rust.yml can't surface it — Unix paths never get the
  # prefix). Lives here, not in the shared reusable, so jj-gt isn't
  # dragged onto Windows. `continue-on-error` keeps it informational
  # while the Windows toolchain install stabilizes — the required
  # `jj-hooks CI` rollup does NOT gate on it yet. Promote to required
  # (drop continue-on-error, add to the rollup's needs) once it's
  # reliably green.
  test-windows:
    name: Test (jj-hooks, windows-latest)
    needs: [optimize_ci, changes]
    if: |
      needs.optimize_ci.outputs.skip == 'false' &&
      needs.changes.outputs.changed == 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    continue-on-error: true
    env:
      CARGO_TERM_COLOR: always
      # uv installs tool executables here; we add it to PATH below.
      # On Windows uv ignores XDG_BIN_HOME and defaults to
      # %LOCALAPPDATA%\uv\bin unless UV_TOOL_BIN_DIR is set, so pin it
      # explicitly to keep pre-commit/prek on the PATH we export.
      XDG_BIN_HOME: ${{ github.workspace }}\.tools\bin
      XDG_DATA_HOME: ${{ github.workspace }}\.tools\data
      UV_TOOL_BIN_DIR: ${{ github.workspace }}\.tools\bin
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "test-jj-hooks-windows"
          save-if: "true"

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-binstall

      - uses: astral-sh/setup-uv@v6

      # Latest jj (windows MSVC zip) — matches the unpinned Unix legs so
      # Windows catches jj CLI drift too.
      - name: Install latest jj
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = (Invoke-RestMethod "https://api.github.com/repos/jj-vcs/jj/releases/latest").tag_name
          if (-not $tag) { throw "could not resolve latest jj release tag" }
          $triple = "x86_64-pc-windows-msvc"
          $url = "https://github.com/jj-vcs/jj/releases/download/$tag/jj-$tag-$triple.zip"
          New-Item -ItemType Directory -Force -Path $env:XDG_BIN_HOME | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP "jj.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $env:XDG_BIN_HOME -Force
          & "$env:XDG_BIN_HOME\jj.exe" --version

      # Hook-runner stack: pre-commit + prek via uv, lefthook + pkl +
      # actionlint via release assets, hk via cargo-binstall. Versions
      # mirror the Unix install in ci-base-rust.yml.
      - name: Install jj-hooks hook stack
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bin = $env:XDG_BIN_HOME
          New-Item -ItemType Directory -Force -Path $bin | Out-Null

          uv tool install pre-commit
          uv tool install prek

          Invoke-WebRequest -Uri "https://github.com/evilmartians/lefthook/releases/download/v2.1.6/lefthook_2.1.6_Windows_x86_64.exe" -OutFile "$bin\lefthook.exe"
          Invoke-WebRequest -Uri "https://github.com/apple/pkl/releases/download/0.31.1/pkl-windows-amd64.exe" -OutFile "$bin\pkl.exe"

          $alZip = Join-Path $env:RUNNER_TEMP "actionlint.zip"
          Invoke-WebRequest -Uri "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_windows_amd64.zip" -OutFile $alZip
          Expand-Archive -Path $alZip -DestinationPath $bin -Force

          cargo binstall -y --install-path $bin hk

      - name: Add tool dir to PATH
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_PATH -Value $env:XDG_BIN_HOME

      - name: Configure git identity
        shell: pwsh
        run: |
          git config --global user.name "jj-hooks CI"
          git config --global user.email "ci@jj-hooks.invalid"

      # Scoped to the workspace integration tests + lib unit tests. The
      # workspace suite is what exercises the `git worktree add` /
      # primary-git-dir path the dunce fix targets (jj + git only, no
      # symlinks). The remaining integration suites (runner resolution,
      # push, the shared harness) stage binaries via
      # `std::os::unix::fs::symlink` + `PermissionsExt` to test
      # Unix-specific PATH/wrapper resolution — they don't compile on
      # Windows and the behaviour they cover doesn't exist here, so they
      # stay Unix-only.
      - name: Tests
        shell: pwsh
        run: cargo nextest run -p jj-hooks --lib --test workspace --no-fail-fast

  # Rollup gate. ALWAYS fires, regardless of whether the dispatch job
  # ran or was skipped by the path filter. This is the single stable
  # check context the branch-protection ruleset gates on
  # (`jj-hooks CI`).
  #
  # Why this exists: a job that delegates via `uses:` doesn't publish
  # its own check context — only the reusable's children do, prefixed
  # with the dispatch job's display name. When the dispatch is
  # skipped (path filter mismatch), the reusable never fires, so
  # those children never report — making them unusable as required
  # checks. This rollup synthesizes a single context that fires in
  # both cases.
  #
  # Treat `success` and `skipped` upstream as pass (`skipped` means
  # the path filter or graphite skip legitimately suppressed the work,
  # not a failure); `failure` and `cancelled` upstream are fail.
  ci:
    name: jj-hooks CI
    needs: [optimize_ci, changes, ci-dispatch]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Rollup ci-dispatch result
        run: |
          set -euo pipefail
          result='${{ needs.ci-dispatch.result }}'
          case "$result" in
            success|skipped)
              echo "ci-dispatch reported $result — pass"
              ;;
            *)
              echo "ci-dispatch reported $result — fail" >&2
              exit 1
              ;;
          esac
