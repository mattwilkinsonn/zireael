name: docs

"on":
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  optimize_ci:
    name: Optimize CI
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      actions: write
    timeout-minutes: 2
    outputs:
      skip: ${{ steps.check_skip.outputs.skip }}
    steps:
      - id: check_skip
        uses: withgraphite/graphite-ci-action@26bc0dcdeaba101794931d67a464ecbb21a76a8b # v0.0.9
        with:
          graphite_token: ${{ secrets.GRAPHITE_TOKEN }}

  changes:
    name: Detect docs Changes
    needs: [optimize_ci]
    if: needs.optimize_ci.outputs.skip == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 3
    outputs:
      changed: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v6
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: .github/path-filters/docs.yml

  ci:
    name: docs CI
    needs: [optimize_ci, changes]
    if: |
      needs.optimize_ci.outputs.skip == 'false' &&
      needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - name: Install markdownlint-cli2
        run: npm install -g markdownlint-cli2
      - name: markdownlint
        run: markdownlint-cli2 "**/*.md"
