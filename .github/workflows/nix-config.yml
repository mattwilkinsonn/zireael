name: nix-config

"on":
  pull_request:

# Per-tool concurrency: a fixup push to a PR cancels in-flight runs
# for the same PR but doesn't disturb other PRs' nix-config runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write  # propagated to ci-base-nix.yml for Determinate Nix OIDC

jobs:
  optimize_ci:
    name: Optimize CI
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      actions: write  # for graphite-ci-action's cancelWorkflowRun call
    timeout-minutes: 2
    outputs:
      skip: ${{ steps.check_skip.outputs.skip }}
    steps:
      - id: check_skip
        uses: withgraphite/graphite-ci-action@26bc0dcdeaba101794931d67a464ecbb21a76a8b # v0.0.9
        with:
          graphite_token: ${{ secrets.GRAPHITE_TOKEN }}

  # ─── Detect ────────────────────────────────────────────────────────
  # Top-level nix-config filter — gates the linter chain.

  changes:
    name: Detect nix-config Changes
    needs: [optimize_ci]
    if: needs.optimize_ci.outputs.skip == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 3
    outputs:
      changed: ${{ steps.filter.outputs.nix-config }}
    steps:
      - uses: actions/checkout@v6
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: .github/path-filters/nix-config.yml

  # ─── Per-host filters ──────────────────────────────────────────────
  # One filter per flake target so we can skip eval for hosts not
  # affected by the diff. Each output (rpi4, rpi5, …) is wired to its
  # matching flake-eval job below.

  host-changes:
    name: Detect per-host Changes
    needs: [optimize_ci]
    if: needs.optimize_ci.outputs.skip == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 3
    outputs:
      rpi4: ${{ steps.filter.outputs.rpi4 }}
      rpi5: ${{ steps.filter.outputs.rpi5 }}
      mattserver: ${{ steps.filter.outputs.mattserver }}
      mattlinuxpro: ${{ steps.filter.outputs.mattlinuxpro }}
      mattfw: ${{ steps.filter.outputs.mattfw }}
      mattpc-wsl: ${{ steps.filter.outputs.mattpc-wsl }}
      darwin-mbp: ${{ steps.filter.outputs.darwin-mbp }}
      mattmini: ${{ steps.filter.outputs.mattmini }}
      awsmac: ${{ steps.filter.outputs.awsmac }}
    steps:
      - uses: actions/checkout@v6
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: .github/path-filters/nix-config-hosts.yml

  # ─── Linters ───────────────────────────────────────────────────────
  # Top-level filter gates the linter chain (nix-fmt + shellcheck etc.).
  # Always runs when any nix-config path changed; not per-host.
  #
  # See jj-hooks.yml for the rationale on the dispatch + rollup split.
  # The `ci` rollup below is what branch protection gates on.

  lints-dispatch:
    name: nix-config (matrix)
    needs: [optimize_ci, changes]
    if: |
      needs.optimize_ci.outputs.skip == 'false' &&
      needs.changes.outputs.changed == 'true'
    uses: ./.github/workflows/ci-base-nix.yml
    secrets: inherit

  # ─── Flake eval (per-host) ─────────────────────────────────────────
  # Each job gates on its own filter output. NixOS hosts run on
  # ubuntu-latest; darwin needs macOS (nix-darwin attrs aren't
  # available cross-platform).
  #
  # The Determinate Nix install dominates the runtime here (~3 min
  # vs the eval itself which is seconds-to-low-minutes once warm),
  # so skipping a host saves real CI minutes.

  flake-eval-rpi4:
    name: flake eval (rpi4)
    needs: [optimize_ci, host-changes]
    if: |
      needs.optimize_ci.outputs.skip == 'false' &&
      needs.host-changes.outputs.rpi4 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: nix eval rpi4
        working-directory: nix-config
        run: nix eval --raw '.#nixosConfigurations.rpi4.config.system.build.toplevel.outPath' --no-warn-dirty --accept-flake-config >/dev/null

  flake-eval-rpi5:
    name: flake eval (rpi5)
    needs: [optimize_ci, host-changes]
    if: |
      needs.optimize_ci.outputs.skip == 'false' &&
      needs.host-changes.outputs.rpi5 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: nix eval rpi5
        working-directory: nix-config
        run: nix eval --raw '.#nixosConfigurations.rpi5.config.system.build.toplevel.outPath' --no-warn-dirty --accept-flake-config >/dev/null

  flake-eval-mattserver:
    name: flake eval (mattserver)
    needs: [optimize_ci, host-changes]
    if: |
      needs.optimize_ci.outputs.skip == 'false' &&
      needs.host-changes.outputs.mattserver == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: nix eval mattserver
        working-directory: nix-config
        run: nix eval --raw '.#nixosConfigurations.mattserver.config.system.build.toplevel.outPath' --no-warn-dirty --accept-flake-config >/dev/null

  flake-eval-mattlinuxpro:
    name: flake eval (mattlinuxpro)
    needs: [optimize_ci, host-changes]
    if: |
      needs.optimize_ci.outputs.skip == 'false' &&
      needs.host-changes.outputs.mattlinuxpro == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: nix eval mattlinuxpro
        working-directory: nix-config
        run: nix eval --raw '.#nixosConfigurations.mattlinuxpro.config.system.build.toplevel.outPath' --no-warn-dirty --accept-flake-config >/dev/null

  flake-eval-mattfw:
    name: flake eval (mattfw)
    needs: [optimize_ci, host-changes]
    if: |
      needs.optimize_ci.outputs.skip == 'false' &&
      needs.host-changes.outputs.mattfw == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: nix eval mattfw
        working-directory: nix-config
        run: nix eval --raw '.#nixosConfigurations.mattfw.config.system.build.toplevel.outPath' --no-warn-dirty --accept-flake-config >/dev/null

  flake-eval-mattpc-wsl:
    name: flake eval (mattpc-wsl)
    needs: [optimize_ci, host-changes]
    if: |
      needs.optimize_ci.outputs.skip == 'false' &&
      needs.host-changes.outputs['mattpc-wsl'] == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: nix eval mattpc-wsl
        working-directory: nix-config
        run: nix eval --raw '.#nixosConfigurations.mattpc-wsl.config.system.build.toplevel.outPath' --no-warn-dirty --accept-flake-config >/dev/null

  flake-eval-darwin:
    name: flake eval (Matts-MacBook-Pro)
    needs: [optimize_ci, host-changes]
    if: |
      needs.optimize_ci.outputs.skip == 'false' &&
      needs.host-changes.outputs['darwin-mbp'] == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: nix eval Matts-MacBook-Pro
        working-directory: nix-config
        run: nix eval --raw '.#darwinConfigurations.Matts-MacBook-Pro.config.system.build.toplevel.outPath' --no-warn-dirty --accept-flake-config >/dev/null

  flake-eval-mattmini:
    name: flake eval (mattmini)
    needs: [optimize_ci, host-changes]
    if: |
      needs.optimize_ci.outputs.skip == 'false' &&
      needs.host-changes.outputs.mattmini == 'true'
    # aarch64 darwin host. GitHub's macos-latest is aarch64-darwin, so
    # this matches the target arch natively (nix eval doesn't build, but
    # the arch lines up regardless).
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: nix eval mattmini
        working-directory: nix-config
        run: nix eval --raw '.#darwinConfigurations.mattmini.config.system.build.toplevel.outPath' --no-warn-dirty --accept-flake-config >/dev/null

  flake-eval-awsmac:
    name: flake eval (awsmac)
    needs: [optimize_ci, host-changes]
    if: |
      needs.optimize_ci.outputs.skip == 'false' &&
      needs.host-changes.outputs.awsmac == 'true'
    # aarch64 darwin host. GitHub's macos-latest is aarch64-darwin, so
    # this matches the target arch natively (nix eval doesn't build, but
    # the arch lines up regardless).
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: nix eval awsmac
        working-directory: nix-config
        run: nix eval --raw '.#darwinConfigurations.awsmac.config.system.build.toplevel.outPath' --no-warn-dirty --accept-flake-config >/dev/null

  # ─── Rollup gate ────────────────────────────────────────────────────
  # Single stable check context for branch protection (`nix-config CI`).
  # Rolls up the linter chain AND every per-host flake-eval — a failure
  # in any one of them fails the gate, but a skip (path filter or
  # graphite skip) passes. Matches the per-job required-check semantics
  # that used to live in the ruleset for each individual job, just
  # collapsed to one stable name.
  #
  # See jj-hooks.yml for the rationale on why a reusable-call needs a
  # dedicated rollup to be ruleset-friendly.

  ci:
    name: nix-config CI
    needs:
      - optimize_ci
      - changes
      - lints-dispatch
      - flake-eval-rpi4
      - flake-eval-rpi5
      - flake-eval-mattserver
      - flake-eval-mattlinuxpro
      - flake-eval-mattfw
      - flake-eval-mattpc-wsl
      - flake-eval-darwin
      - flake-eval-mattmini
      - flake-eval-awsmac
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Rollup upstream jobs
        run: |
          set -euo pipefail
          # Each upstream job reports one of: success, failure, cancelled, skipped.
          # success/skipped → contribute pass; failure/cancelled → fail the gate.
          declare -A results=(
            [lints-dispatch]='${{ needs.lints-dispatch.result }}'
            [flake-eval-rpi4]='${{ needs.flake-eval-rpi4.result }}'
            [flake-eval-rpi5]='${{ needs.flake-eval-rpi5.result }}'
            [flake-eval-mattserver]='${{ needs.flake-eval-mattserver.result }}'
            [flake-eval-mattlinuxpro]='${{ needs.flake-eval-mattlinuxpro.result }}'
            [flake-eval-mattfw]='${{ needs.flake-eval-mattfw.result }}'
            [flake-eval-mattpc-wsl]='${{ needs.flake-eval-mattpc-wsl.result }}'
            [flake-eval-darwin]='${{ needs.flake-eval-darwin.result }}'
            [flake-eval-mattmini]='${{ needs.flake-eval-mattmini.result }}'
            [flake-eval-awsmac]='${{ needs.flake-eval-awsmac.result }}'
          )
          failed=0
          for job in "${!results[@]}"; do
            result="${results[$job]}"
            case "$result" in
              success|skipped) echo "✓ $job: $result" ;;
              *) echo "✗ $job: $result" >&2; failed=1 ;;
            esac
          done
          if [ "$failed" -ne 0 ]; then
            echo "one or more upstream jobs failed — see above" >&2
            exit 1
          fi
          echo "all upstream jobs passed or were skipped"
