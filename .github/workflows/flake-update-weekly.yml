name: flake-update-weekly

# Weekly full refresh of every flake input (nixpkgs, nixpkgs-unstable,
# home-manager, nix-darwin, nixos-wsl, and the rest). The daily job
# handles the fast-moving llm-agents + codex-cli inputs; this catches
# everything else. Opens a PR against main; Matt reviews + merges.
#
# Distinct branch from the daily job so the two PRs never collide.
#
# The PR is opened over a token minted from the zireael-release GitHub App
# (App ID in vars.RELEASE_BOT_APP_ID, key in secrets.RELEASE_BOT_PRIVATE_KEY)
# — the default GITHUB_TOKEN cannot open PRs (GitHub blocks Actions-authored
# PR creation), and an App-authored PR also triggers the on:pull_request
# checks. The App must carry contents:write + pull-requests:write.

"on":
  schedule:
    - cron: "0 7 * * 1" # 07:00 UTC Mondays
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write # Determinate Nix OIDC

jobs:
  update:
    name: update flake.lock (all inputs)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
      - uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: DeterminateSystems/update-flake-lock@main
        with:
          path-to-flake-dir: nix-config
          branch: flake-update-weekly
          commit-msg: "chore(nix): update flake.lock"
          pr-title: "chore(nix): weekly flake.lock update"
          pr-labels: |
            nix
            automated
          nix-options: --accept-flake-config
          token: ${{ steps.app-token.outputs.token }}
