name: flake-update-daily

# Daily refresh of llm-agents — the fast-moving input that bundles the LLM
# CLIs (omp / claude-code / codex / amp / sandbox-runtime / etc.) and bumps
# basically every day.
# Opens a PR against main; Matt reviews + merges. The weekly job
# (flake-update-weekly.yml) refreshes everything else.
#
# flake.nix lives under nix-config/, hence path-to-flake-dir. The PR is
# opened over a token minted from the zireael-release GitHub App (App ID in
# vars.RELEASE_BOT_APP_ID, key in secrets.RELEASE_BOT_PRIVATE_KEY) — the
# default GITHUB_TOKEN cannot open PRs (GitHub blocks Actions-authored PR
# creation), and an App-authored PR also triggers the on:pull_request checks.
# The App must carry contents:write + pull-requests:write.

"on":
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC daily (after nightly's 06:00 eval)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write # Determinate Nix OIDC

jobs:
  update:
    name: update flake.lock (llm-agents)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
      - uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: DeterminateSystems/update-flake-lock@main
        with:
          path-to-flake-dir: nix-config
          inputs: llm-agents
          branch: flake-update-daily
          commit-msg: "chore(nix): update flake.lock (llm-agents)"
          pr-title: "chore(nix): daily flake.lock (llm-agents)"
          pr-labels: |
            nix
            automated
          nix-options: --accept-flake-config
          token: ${{ steps.app-token.outputs.token }}
