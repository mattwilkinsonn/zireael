name: nightly

# Daily cron that runs the full moon gate unconditionally (ignores
# affected detection). Catches drift from upstream auto-updates (the
# devenv/nixpkgs linters, npm registry) that a code-change PR wouldn't
# trigger.
#
# Skipped when `main` hasn't advanced since the last nightly. The `report`
# job posts the aggregate result back to the HEAD commit.

"on":
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Determinate Nix (devenv + flake-eval) needs OIDC

jobs:
  # Gate: only run the suite if main moved since the last nightly.
  changes:
    name: detect new commits
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "manual dispatch — running."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(gh api \
            "repos/$REPO/actions/workflows/nightly.yml/runs?event=schedule&status=completed&per_page=1" \
            --jq '.workflow_runs[0].head_sha // ""')
          if [ "$last" = "$SHA" ]; then
            echo "main unchanged since last nightly ($SHA) — skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "main advanced ($last -> $SHA) — running."
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  # Full moon gate on Linux: every project's `ci` task, unconditionally
  # (`moon run :ci` runs the task in all projects; no affected filtering).
  # A fresh runner has no moon cache, so every task re-runs — which is the
  # point (catches upstream toolchain drift).
  moon-ci:
    name: moon ci (linux, full)
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: Install devenv
        run: nix profile install --accept-flake-config nixpkgs#devenv
      - name: moon run :ci
        run: devenv shell -- moon run ':ci'

  # macOS leg: tap brew-style (brew is present on macOS runners).
  moon-ci-darwin:
    name: moon ci (tap)
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: Install devenv
        run: nix profile install --accept-flake-config nixpkgs#devenv
      - name: moon run tap:ci
        run: devenv shell -- moon run tap:ci

  # Post the aggregate nightly result to the HEAD commit so it shows in
  # the commit's checks dropdown (scheduled runs don't auto-attach).
  report:
    name: report status
    needs:
      - changes
      - moon-ci
      - moon-ci-darwin
    if: always() && needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Post nightly status to HEAD commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATE: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 'failure' || 'success' }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/$REPO/statuses/$SHA" \
            -f state="$STATE" \
            -f context="nightly" \
            -f description="nightly suite: $STATE" \
            -f target_url="$RUN_URL"
