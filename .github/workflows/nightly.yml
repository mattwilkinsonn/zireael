name: nightly

# Daily cron that ignores path filters and runs the full matrix.
# Catches drift caused by upstream tool auto-updates (hk, pkl, jj
# versions, brew formulae, npm registry, etc.) — anything that
# wouldn't be triggered by a code change in this repo.
#
# Skipped when `main` hasn't advanced since the last nightly (no point
# re-running the same commit). The `report` job posts the aggregate
# result back to the HEAD commit so it appears in the commit's checks.

"on":
  schedule:
    - cron: "0 6 * * *"  # 06:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # Determinate Nix in nix-config flake-eval jobs needs OIDC

jobs:
  # Gate: only run the suite if main moved since the last nightly.
  changes:
    name: detect new commits
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "manual dispatch — running."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(gh api \
            "repos/$REPO/actions/workflows/nightly.yml/runs?event=schedule&status=completed&per_page=1" \
            --jq '.workflow_runs[0].head_sha // ""')
          if [ "$last" = "$SHA" ]; then
            echo "main unchanged since last nightly ($SHA) — skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "main advanced ($last -> $SHA) — running."
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  jj-hooks:
    name: jj-hooks (nightly)
    needs: changes
    if: needs.changes.outputs.run == 'true'
    uses: ./.github/workflows/ci-base-rust.yml
    with:
      package: jj-hooks
      install_deps: true
    secrets: inherit

  jj-gt:
    name: jj-gt (nightly)
    needs: changes
    if: needs.changes.outputs.run == 'true'
    uses: ./.github/workflows/ci-base-rust.yml
    with:
      package: jj-gt
      install_deps: true
    secrets: inherit

  akiflow-cli:
    name: akiflow-cli (nightly)
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: tools/akiflow-cli
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - run: bun install --frozen-lockfile
      - run: bunx biome check .
      - run: bunx tsc --noEmit
      - run: bun test

  tap:
    name: tap (nightly)
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - run: brew style Formula/*.rb

  # Linters run regardless of host changes — different content domain
  # than the per-host flake-eval. Reuses ci-base-nix.yml so the
  # commands match what nix-config.yml runs on PRs.
  nix-config-lints:
    name: nix-config lints (nightly)
    needs: changes
    if: needs.changes.outputs.run == 'true'
    uses: ./.github/workflows/ci-base-nix.yml
    secrets: inherit

  # Full-matrix flake-eval on nightly — bypasses the per-host path
  # filters that gate nix-config.yml. Catches drift from flake input
  # updates (nixpkgs-unstable's daily churn) that wouldn't fire a
  # path-filter on a PR. Defined inline (not via ci-base-nix.yml)
  # because nightly's "always run every host" shape differs from
  # nix-config.yml's per-host gating.
  flake-eval-rpi4-nightly:
    name: flake eval rpi4 (nightly)
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3
      - working-directory: nix-config
        run: nix eval --raw '.#nixosConfigurations.rpi4.config.system.build.toplevel.outPath' --no-warn-dirty --accept-flake-config >/dev/null

  flake-eval-rpi5-nightly:
    name: flake eval rpi5 (nightly)
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3
      - working-directory: nix-config
        run: nix eval --raw '.#nixosConfigurations.rpi5.config.system.build.toplevel.outPath' --no-warn-dirty --accept-flake-config >/dev/null

  flake-eval-mattserver-nightly:
    name: flake eval mattserver (nightly)
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3
      - working-directory: nix-config
        run: nix eval --raw '.#nixosConfigurations.mattserver.config.system.build.toplevel.outPath' --no-warn-dirty --accept-flake-config >/dev/null

  flake-eval-mattlinuxpro-nightly:
    name: flake eval mattlinuxpro (nightly)
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3
      - working-directory: nix-config
        run: nix eval --raw '.#nixosConfigurations.mattlinuxpro.config.system.build.toplevel.outPath' --no-warn-dirty --accept-flake-config >/dev/null

  flake-eval-mattfw-nightly:
    name: flake eval mattfw (nightly)
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3
      - working-directory: nix-config
        run: nix eval --raw '.#nixosConfigurations.mattfw.config.system.build.toplevel.outPath' --no-warn-dirty --accept-flake-config >/dev/null

  flake-eval-mattpc-wsl-nightly:
    name: flake eval mattpc-wsl (nightly)
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3
      - working-directory: nix-config
        run: nix eval --raw '.#nixosConfigurations.mattpc-wsl.config.system.build.toplevel.outPath' --no-warn-dirty --accept-flake-config >/dev/null

  flake-eval-darwin-nightly:
    name: flake eval Matts-MacBook-Pro (nightly)
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3
      - working-directory: nix-config
        run: nix eval --raw '.#darwinConfigurations.Matts-MacBook-Pro.config.system.build.toplevel.outPath' --no-warn-dirty --accept-flake-config >/dev/null

  flake-eval-mattmini-nightly:
    name: flake eval mattmini (nightly)
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3
      - working-directory: nix-config
        run: nix eval --raw '.#darwinConfigurations.mattmini.config.system.build.toplevel.outPath' --no-warn-dirty --accept-flake-config >/dev/null

  flake-eval-awsmac-nightly:
    name: flake eval awsmac (nightly)
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3
      - working-directory: nix-config
        run: nix eval --raw '.#darwinConfigurations.awsmac.config.system.build.toplevel.outPath' --no-warn-dirty --accept-flake-config >/dev/null

  validate-tap:
    name: validate tap install (nightly, ${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
      - name: Tap, install, and test every formula
        run: |
          set -euo pipefail
          brew tap mattwilkinsonn/zireael https://github.com/mattwilkinsonn/zireael
          brew trust mattwilkinsonn/zireael
          for formula in jj-hooks jj-gt akiflow-cli; do
            echo "::group::${formula}"
            brew install "mattwilkinsonn/zireael/${formula}"
            brew test "mattwilkinsonn/zireael/${formula}"
            echo "::endgroup::"
          done

  docs:
    name: docs (nightly)
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - run: npm install -g markdownlint-cli2
      - run: markdownlint-cli2 "**/*.md"

  # Post the aggregate nightly result to the HEAD commit so it shows in
  # the commit's checks dropdown (scheduled runs don't auto-attach).
  report:
    name: report status
    needs:
      - changes
      - jj-hooks
      - jj-gt
      - akiflow-cli
      - tap
      - validate-tap
      - docs
      - nix-config-lints
      - flake-eval-rpi4-nightly
      - flake-eval-rpi5-nightly
      - flake-eval-mattserver-nightly
      - flake-eval-mattlinuxpro-nightly
      - flake-eval-mattfw-nightly
      - flake-eval-mattpc-wsl-nightly
      - flake-eval-darwin-nightly
      - flake-eval-mattmini-nightly
      - flake-eval-awsmac-nightly
    if: always() && needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Post nightly status to HEAD commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATE: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 'failure' || 'success' }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/$REPO/statuses/$SHA" \
            -f state="$STATE" \
            -f context="nightly" \
            -f description="nightly suite: $STATE" \
            -f target_url="$RUN_URL"
