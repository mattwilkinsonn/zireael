# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
#
# akiflow-cli (`af`) — a bun/TypeScript tool with its own bun.lock (not a
# hoisted root workspace), so it owns its `install`. System tasks exec the bun
# toolchain the devenv shell provides via proto; commands match the old gate
# (ci-akiflow-cli): biome check + tsc --noEmit + bun test.
layer: 'application'
language: 'typescript'

tasks:
  install:
    command: 'bun install --frozen-lockfile'
    inputs: ['package.json', 'bun.lock', 'bunfig.toml']
    options:
      cache: false
  lint:
    command: 'bunx biome check .'
    deps: ['install']
    inputs: ['src/**/*', 'biome.json', 'package.json']
  typecheck:
    command: 'bunx tsc --noEmit'
    deps: ['install']
    inputs: ['src/**/*', 'tsconfig.json', 'package.json']
  test:
    command: 'bun test'
    deps: ['install']
    inputs: ['src/**/*', 'package.json', 'bun.lock']
    options:
      cache: false
  ci:
    deps: ['lint', 'typecheck', 'test']
    options:
      cache: false
